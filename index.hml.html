<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Shop BD</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f5f5f5;
      color: #222;
    }

    header {
      background: #111;
      color: white;
      text-align: center;
      padding: 22px 10px;
    }

    header h1 {
      font-size: 32px;
    }

    header p {
      margin-top: 7px;
      color: #ddd;
    }

    .container {
      max-width: 1000px;
      margin: 25px auto;
      padding: 0 15px;
    }

    .products {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
    }

    .product {
      background: white;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 3px 12px rgba(0,0,0,.12);
      text-align: center;
      padding-bottom: 18px;
    }

    .product img {
      width: 100%;
      height: 230px;
      object-fit: cover;
      display: block;
    }

    .product h2 {
      font-size: 20px;
      margin: 15px 8px 8px;
    }

    .price {
      font-size: 19px;
      font-weight: bold;
      margin-bottom: 12px;
    }

    .order-btn {
      display: inline-block;
      background: #16a34a;
      color: white;
      text-decoration: none;
      padding: 11px 25px;
      border-radius: 7px;
      font-weight: bold;
    }

    .order-btn:hover {
      background: #12833c;
    }

    .delivery {
      background: white;
      margin-top: 25px;
      padding: 18px;
      border-radius: 10px;
      text-align: center;
    }

    footer {
      margin-top: 35px;
      background: #111;
      color: white;
      text-align: center;
      padding: 20px;
    }
  </style>
</head>

<body>

<header>
  <h1>Shop BD</h1>
  <p>Quality Products • Easy Order • Home Delivery</p>
</header>

<div class="container">

  <div class="products">

    <!-- Product 1 -->
    <div class="product">
      <img src="images/product1.jpg" alt="Apple AirPods">
      <h2>Apple AirPods</h2>
      <div class="price">৳700</div>
      <a class="order-btn"
         href="https://wa.me/8801945179345?text=আমি%20Apple%20AirPods%20অর্ডার%20করতে%20চাই">
        অর্ডার করুন
      </a>
    </div>

    <!-- Product 2 -->
    <div class="product">
      <img src="images/product2.jpg" alt="Neckband Black">
      <h2>Neckband - Black</h2>
      <div class="price">৳550</div>
      <a class="order-btn"
         href="https://wa.me/8801945179345?text=আমি%20Black%20Neckband%20অর্ডার%20করতে%20চাই">
        অর্ডার করুন
      </a>
    </div>

    <!-- Product 3 -->
    <div class="product">
      <img src="images/product3.jpg" alt="Neckband White">
      <h2>Neckband - White</h2>
      <div class="price">৳500</div>
      <a class="order-btn"
         href="https://wa.me/8801945179345?text=আমি%20White%20Neckband%20অর্ডার%20করতে%20চাই">
        অর্ডার করুন
      </a>
    </div>

  </div>

  <div class="delivery">
    <h3>🚚 Delivery Charge</h3>
    <p>সারা বাংলাদেশে ডেলিভারি চার্জ: ৳150</p>
  </div>

</div>

<footer>
  <p>© 2026 Shop BD. All Rights Reserved.</p>
</footer>

</body>
</html>
